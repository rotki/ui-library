blockExoticSubdeps: true

minimumReleaseAge: 10080
# First-party rotki packages: the maturity gate guards against third-party
# supply-chain surprises, and waiting a week on our own lint rules only
# delays fixing what they flag.
minimumReleaseAgeExclude:
  - '@rotki/eslint-config'
  - '@rotki/eslint-plugin'

trustPolicy: no-downgrade
trustPolicyExclude:
  - 'semver@5.7.2 || 6.3.1'

shamefullyHoist: true
shellEmulator: true
strictDepBuilds: true
saveExact: true

packages:
  - 'packages/*'
  - 'apps/*'

overrides:
  chokidar: 5.0.0
  jiti: ^2.6.1
  # oxfmt 0.35, which eslint-plugin-format caps us at, pins tinypool 2.1.0
  # (GHSA advisories fixed in 2.1.2).
  oxfmt>tinypool: 2.2.0

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  msw: false

catalog:
  '@commitlint/cli': 21.2.4
  '@commitlint/config-conventional': 21.2.4
  '@floating-ui/dom': 1.8.0
  '@fontsource-variable/geist-mono': 5.3.0
  '@fontsource-variable/inter': 5.3.0
  '@playwright/test': 1.63.0
  '@rotki/eslint-config': 8.4.1
  '@rotki/eslint-plugin': 1.10.0
  '@storybook/addon-a11y': 10.6.7
  '@storybook/addon-docs': 10.6.7
  '@storybook/addon-links': 10.6.7
  '@storybook/addon-themes': 10.6.7
  '@storybook/addon-vitest': 10.6.7
  '@storybook/vue3-vite': 10.6.7
  '@tailwindcss/vite': 4.3.5
  '@tsconfig/node24': 24.0.6
  '@types/node': 24.19.2
  '@types/tinycolor2': 1.4.6
  '@vitejs/plugin-vue': 6.0.11
