blockExoticSubdeps: true
minimumReleaseAge: 10080
# First-party rotki packages: the maturity gate guards against third-party
# supply-chain surprises, and waiting a week on our own lint rules only
# delays fixing what they flag.
minimumReleaseAgeExclude:
  - '@rotki/eslint-config'
  - '@rotki/eslint-plugin'
trustPolicy: no-downgrade
trustPolicyExclude:
  - tailwind-merge@2.6.1
  - 'semver@5.7.2 || 6.3.1'

peerDependencyRules:
  allowedVersions:
    tailwind-variants>tailwind-merge: '>=2.0.0 <3.0.0'
shamefullyHoist: true
shellEmulator: true
strictDepBuilds: true
saveExact: true
packages:
  - 'packages/*'
  - 'apps/*'

overrides:
  chokidar: 5.0.0
  jiti: ^2.6.1

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  msw: false

catalog:
  '@commitlint/cli': 21.2.2
  '@commitlint/config-conventional': 21.2.2
  '@floating-ui/dom': 1.8.0
  '@fontsource/roboto': 5.3.0
  '@playwright/test': 1.62.1
  '@rotki/eslint-config': 8.3.0
  '@rotki/eslint-plugin': 1.8.0
  '@storybook/addon-a11y': 10.6.0
  '@storybook/addon-docs': 10.6.0
  '@storybook/addon-links': 10.6.0
  '@storybook/addon-themes': 10.6.0
  '@storybook/addon-vitest': 10.6.0
  '@storybook/vue3-vite': 10.6.0
  '@tsconfig/node24': 24.0.5
  '@types/node': 24.13.3
  '@types/tinycolor2': 1.4.6
