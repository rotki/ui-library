blockExoticSubdeps: true
minimumReleaseAge: 10080
# First-party rotki packages: the maturity gate guards against third-party
# supply-chain surprises, and waiting a week on our own lint rules only
# delays fixing what they flag.
minimumReleaseAgeExclude:
  - '@rotki/eslint-config'
  - '@rotki/eslint-plugin'
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'semver@5.7.2 || 6.3.1'

shamefullyHoist: true
shellEmulator: true
strictDepBuilds: true
saveExact: true
packages:
  - 'packages/*'
  - 'apps/*'

overrides:
  chokidar: 5.0.0
  jiti: ^2.6.1

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  msw: false

