blockExoticSubdeps: true
minimumReleaseAge: 10080
saveExact: true
shamefullyHoist: true
shellEmulator: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - tailwind-merge@2.6.1
  - 'semver@5.7.2 || 6.3.1'

packages:
  - 'packages/*'
  - 'apps/*'

overrides:
  chokidar: 5.0.0
  jiti: ^2.6.1

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  msw: false

catalog:
  '@commitlint/cli': 21.2.1
  '@commitlint/config-conventional': 21.2.0
  '@floating-ui/dom': 1.8.0
  '@fontsource/roboto': 5.3.0
  '@playwright/test': 1.61.1
  '@rotki/eslint-config': 6.2.0
  '@rotki/eslint-plugin': 1.5.0
  '@storybook/addon-a11y': 10.5.3
  '@storybook/addon-docs': 10.5.3
  '@storybook/addon-links': 10.5.3
  '@storybook/addon-themes': 10.5.3
  '@storybook/addon-vitest': 10.5.3
  '@storybook/vue3-vite': 10.5.3
  '@tsconfig/node24': 24.0.4
  '@types/node': 24.13.3
  '@types/tinycolor2': 1.4.6
  '@vitejs/plugin-vue': 6.0.8
  '@vitest/browser': 4.1.10
  '@vitest/browser-playwright': 4.1.10
  '@vitest/coverage-v8': 4.1.10
  '@vitest/ui': 4.1.10
  '@vue/test-utils': 2.4.11
  '@vue/tsconfig': 0.9.1
  '@vueuse/core': 14.3.0
  '@vueuse/shared': 14.3.0
  autoprefixer: 10.5.4
  bumpp: 11.1.0
  cac: 7.0.0
  consola: 3.4.2
  eslint: 10.7.0
  eslint-plugin-storybook: 10.5.3
  fast-glob: 3.3.3
  fast-xml-parser: 5.10.1
  fs-extra: 11.3.6
  happy-dom: 20.11.1
  husky: 9.1.7
  lint-staged: 17.2.0
  lucide: 1.26.0
  msw: 2.15.0
  pinia: 3.0.4
  postcss: 8.5.22
  scule: 1.3.0
  storybook: 10.5.3
  tailwind-merge: 2.6.1
  tailwind-variants: 3.2.2
