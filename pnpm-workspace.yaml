  '@vue/tsconfig': 0.9.1
  '@vueuse/core': 14.3.0
  '@vueuse/shared': 14.3.0
  autoprefixer: 10.5.2
  bumpp: 11.1.0
  cac: 7.0.0
  consola: 3.4.2
