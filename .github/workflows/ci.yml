name: ci

on:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - develop
      - bugfixes
  pull_request:
    branches:
      - main
      - develop
      - bugfixes

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: { }

# Layout note: jobs run fully in parallel. Each job that touches code does
# its own `pnpm install` (~30s, cache-warm), and the jobs that test against
# dist also run `pnpm run build:prod` (~16s); `unit` tests the sources and
# only generates the icons. That duplication is intentional: it keeps
# wall-time down by avoiding a serial `build` job that downstream tests
# would have to wait on. The browser jobs (`storybook`, `e2e`, `visual`)
# run in the pinned Playwright image, which costs ~30s to start but skips
# installing Chromium and its system packages.
#
# timeout-minutes on every job is generous headroom over observed run
# times (~1-4m) so a genuine hang is killed quickly instead of running to
# the 6h GitHub default.
jobs:
  commit-lint:
    name: Commit lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # clone the repository
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node env 🏗
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: pnpm exec commitlint --from HEAD~1 --to HEAD --verbose

      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${BASE_SHA}" --to "${HEAD_SHA}" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # Cheap fast-feedback job: lint + typecheck. The build:types step in
  # `build:prod` only covers the library sources, so the library typecheck
  # runs here for the spec and story files (tsconfig.vitest.json).
  validate:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # clone the repository
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node env 🏗
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Run linter 👀
        run: pnpm run lint

      - name: Typecheck library, specs and stories
        run: pnpm --filter @rotki/ui-library typecheck

      - name: Typecheck example app
        run: pnpm --filter example typecheck

  # Vitest unit tests. They run in happy-dom against the sources, so the job
  # needs no browser and no dist, only the generated icons. Uploads the
  # blob-format coverage report so the `coverage` job can merge it with the
  # storybook report.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # clone the repository
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node env 🏗
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Generate icons
        run: pnpm --filter @rotki/ui-library generate-icons

      - name: Run Unit Tests with Coverage
        run: pnpm run coverage:unit

      - name: Upload unit coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-report-unit
          path: packages/ui-library/tests/.vitest-reports/unit.json
          retention-days: 1
          if-no-files-found: error

  # Storybook play-function tests via Playwright. Split off from `unit` so
  # the storybook build (~30-60s) and its test run parallelise with the
  # vitest run instead of stacking serially.
  #
  # Runs in the same pinned Playwright image as `visual` (see there for the
  # pin). The image is written once, here, and `e2e` and `visual` reuse it
  # through the anchor; it has to match the `@playwright/test` version in
  # pnpm-workspace.yaml and the tag in apps/example/scripts/visual-docker.sh.
  # The image ships Chromium and its system packages; installing them on the
  # runner meant an apt fetch that took anywhere from seconds to 8 minutes,
  # depending on the Ubuntu mirror. `--ipc=host` gives Chromium the host's
  # shared memory instead of Docker's 64MB /dev/shm.
  storybook:
    name: Storybook tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: &playwright-image mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    permissions:
      contents: read # clone the repository
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node env 🏗
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:prod

      - name: Build Storybook
        run: pnpm run build:storybook

      - name: Run Storybook Tests with Coverage
        run: pnpm run coverage:storybook

      - name: Upload storybook coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-report-storybook
          path: packages/ui-library/tests/.vitest-reports/storybook.json
          retention-days: 1
          if-no-files-found: error

  # Combine the two coverage blobs and forward to codecov. Tiny job, runs
  # once both producers have finished. If either upstream job is skipped
  # (e.g. a future paths-filter), this job still attempts the merge from
  # whatever coverage is present.
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit, storybook]
    permissions:
      contents: read # clone the repository
      actions: read # download the coverage artifacts uploaded by unit/storybook
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node env 🏗
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Download unit coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vitest-report-unit
          path: packages/ui-library/tests/.vitest-reports

      - name: Download storybook coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vitest-report-storybook
          path: packages/ui-library/tests/.vitest-reports

      # The blobs keep absolute source paths, and `storybook` runs in a
      # container whose workspace is /__w/<repo>/<repo> instead of this
      # runner's. Without the rewrite the merge finds two copies of every
      # file and drops the container's, which lie outside the root.
      - name: Map storybook coverage to the runner workspace
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          sed -i "s#/__w/${repo}/${repo}/#${GITHUB_WORKSPACE}/#g" packages/ui-library/tests/.vitest-reports/storybook.json

      - name: Merge Coverage Reports
        run: pnpm run coverage:merge

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Behavioural Playwright e2e suite against the example app. Sharded ×2
  # so each shard runs ~half the specs in parallel — wall-time drops as
  # the suite grows; the per-shard install/build overhead is the same
  # ~90s as any other job.
  #
  # `fail-fast: false` so one shard's failure doesn't cancel the other —
  # we want to see every failing spec in the same run.
  #
  # Runs in the pinned Playwright image, like `storybook`. Each shard runs
  # two workers (the config keeps CI at one, which `visual` still uses):
  # the runner has four cores and a shard spent ~2 minutes running its
  # specs one after another.
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: *playwright-image
      options: --ipc=host
    permissions:
      contents: read # clone the repository
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node env 🏗
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:prod

      - name: Build example app
        run: pnpm --filter example build:app

      - name: Run Playwright tests (shard ${{ matrix.shard }}/2)
        working-directory: apps/example
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm exec playwright test --shard="${SHARD}/2" --workers=2

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/example/playwright-report/
            apps/example/test-results/
          retention-days: 7

  # Visual regression suite. Runs in Playwright's pinned Docker image so the
  # rendering environment (browser binary + system fonts + freetype + arch)
  # matches what contributors get from `pnpm test:visual`. Without the pin,
  # snapshots captured locally and on CI would diverge by a handful of
  # antialiasing pixels and every run would fail. The image is pinned to its
  # manifest-list digest (the tag is kept as a comment for readability). The
  # image string lives on the `storybook` job, as the `playwright-image` anchor.
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: *playwright-image
    permissions:
      contents: read # clone the repository
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node env 🏗
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter @rotki/ui-library build:prod

      - name: Build example app
        run: pnpm --filter example build:app

      - name: Run visual regression tests
        working-directory: apps/example
        env:
          PLAYWRIGHT_VISUAL: '1'
        run: pnpm exec playwright test e2e/visual

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: visual-playwright-report
          path: |
            apps/example/playwright-report/
            apps/example/test-results/
          retention-days: 7
